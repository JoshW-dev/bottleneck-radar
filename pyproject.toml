[project]
name = "bottleneck-radar"
version = "0.1.0"
description = "Monthly research pipeline: clone a fund's 13F, turn hyperscaler capex into physical units, call the AI supply bottleneck, check your exposure."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
radar = "radar.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
