# Refreshes the public data and the dashboard on the 24th of each month, after Taiwan
# publishes its export orders. Vercel redeploys when the commit lands.
# Needs the SEC_USER_AGENT repository variable ("Your Name you@example.com"). The memo
# also needs the ANTHROPIC_API_KEY secret; without it the run skips the call.
# Account data never runs here: Actions logs on a public repo are public.
name: monthly refresh
on:
  schedule:
    - cron: "0 14 24 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Run the pipeline and render the site
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run radar run
      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: $(date -u +%Y-%m) run"
            git push
          fi
