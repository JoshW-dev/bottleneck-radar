# Updates the picks tracker, checks the open predictions and redraws the dashboard after each US
# trading day. It reads public prices from Yahoo and public releases from Korea, Taiwan and SEC
# EDGAR, so it needs no secrets. The SEC checks wait until the SEC_USER_AGENT variable is set.
# Vercel redeploys on the commit.
name: daily prices
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Price the picks, check the predictions and render the site
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: uv run radar performance && uv run radar predictions && uv run radar site
      - name: Commit the new prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/performance.json data/prediction-results.json data/13f site
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: prices to $(date -u +%F)"
            git pull --rebase
            git push
          fi
