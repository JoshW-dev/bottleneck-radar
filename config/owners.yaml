# Who makes each input. Stage 3 can only name companies listed here, which keeps its answer
# matchable against your positions in Stage 4. Add companies freely; ids are just labels.
# tickers: every symbol the company trades under (US ticker, ADR, home listing as IBKR shows it).

inputs:
  memory:
    label: Memory chips (HBM, DRAM, NAND)
    owners: [sk_hynix, samsung, micron, sandisk, kioxia]
  advanced_chips:
    label: Leading-edge chips and packaging
    owners: [tsmc, ase, amkor]
  gas_turbines:
    label: Large gas turbines
    owners: [ge_vernova, siemens_energy, mhi]
  grid_interconnection:
    label: Grid connections (transformers, switchgear, transmission, on-site power)
    owners: [ge_vernova, siemens_energy, hitachi, schneider, eaton, quanta, bloom]

